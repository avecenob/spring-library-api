spring.application.name=library-api

# Database (env var with local default)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/library}
spring.datasource.username=${DB_USERNAME:library}
spring.datasource.password=${DB_PASSWORD:library}

# JPA
# no lazy loadingn from controllers
spring.jpa.open-in-view=false
# Flyway owns the schema: Hibernate only checks it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}

# Flyway
spring.flyway.enabled=true

# RFC 9457 error bodies for built-in errors
spring.mvc.problemdetails.enabled=true

# Ignored by external Tomcat
server.port=${SERVER_PORT:9000}

# Actuator
management.endpoints.web.exposure.include=health.info